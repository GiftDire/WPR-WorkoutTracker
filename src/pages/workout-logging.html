<!DOCTYPE html>
<html lang="en">
  <head>
    <title>FitPal - Log Your Workout</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="/src/scripts/workout-logger.js">
    <link rel="stylesheet" href="../styles/styles.css" />
    
    <script type="module">
      import { createNavbar } from '../scripts/navbar.js';
      document.body.prepend(createNavbar('logging'));
    </script>
    <script type="module" src="../scripts/workout-logger.js"></script>
  </head>
  <body>
    <main>
      <div class="workout-container">
        <section class="workout-form-section">
          <h1>Log Your Workout</h1>
          <form id="workoutForm" class="workout-form">
            <div class="form-group">
              <label for="workoutType">Workout Type</label>
              <select id="workoutType" name="workoutType" required>
                <option value="">Select a workout type</option>
                <option value="running">Running</option>
                <option value="cycling">Cycling</option>
                <option value="swimming">Swimming</option>
                <option value="strength">Strength Training</option>
                <option value="yoga">Yoga</option>
                <option value="hiit">HIIT</option>
              </select>
            </div>
            
            <div id="distanceField" class="form-group" style="display: none;">
              <label for="distance">Distance (miles)</label>
              <input type="number" id="distance" name="distance" min="0.1" step="0.1">
            </div>
            
            <div class="form-group">
              <label for="duration">Duration (minutes)</label>
              <input type="number" id="duration" name="duration" min="1" max="720" required>
            </div>
            
            <div class="form-group">
              <label for="calories">Calories Burned</label>
              <input type="number" id="calories" name="calories" min="0" max="5000" required>
            </div>
            
            <div class="form-group">
              <label for="date">Date of Workout</label>
              <input type="date" id="date" name="date" required>
            </div>
            
            <button type="submit" class="submit-btn">Log Workout</button>
            
          

          </form>
        </section>

        <section class="workout-list-section">
          <h2>Recent Workouts</h2>
          <div id="workoutList" class="workout-list"></div>
           <div id="celebration-container"></div>
          <div id="workoutList" class="workout-list"></div>
          <button onclick="showMotivationalQuote()" class="motivation-btn">Workout Reminder</button>
     
          <p id="quote"></p>
          <button onclick="printWorkout()"class="print-btn">Workout Summary</button>
       </section>
      </div>
    </main>
  </body>


<script>
const quotes = [
    "Push yourself, because no one else is going to do it for you.",
    "Don’t limit your challenges. Challenge your limits!",
    "The only bad workout is the one that didn’t happen.",
    "Strive for progress, not perfection.",
    "Your body achieves what your mind believes."
];

function showMotivationalQuote() {
    let randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
    document.getElementById("quote").innerText = randomQuote;
}
function printWorkout() {
    let content = document.getElementById("workoutList").innerHTML;
    let printWindow = window.open("", "_blank");
    printWindow.document.write("<html><head><title>Workout Summary</title></head><body>");
    printWindow.document.write(content);
    printWindow.document.write("</body></html>");
    printWindow.document.close();
    printWindow.print();
}
</script>

</html>
